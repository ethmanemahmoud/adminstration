<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Message Filtering Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .status-bar {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .card-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #667eea;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .message-item {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message-id {
            font-weight: bold;
            color: #667eea;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .message-content {
            margin: 10px 0;
            word-wrap: break-word;
        }

        .timestamp {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
        }

        .score-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin: 5px 5px 5px 0;
        }

        .score-low {
            background: #4caf50;
            color: white;
        }

        .score-medium {
            background: #ff9800;
            color: white;
        }

        .score-high {
            background: #f44336;
            color: white;
        }

        .decision-badge {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            margin: 10px 0;
        }

        .decision-ALLOW {
            background: #4caf50;
            color: white;
        }

        .decision-QUARANTINE {
            background: #ff9800;
            color: white;
        }

        .decision-BLOCK {
            background: #f44336;
            color: white;
        }

        .degraded {
            background: #ffeb3b;
            color: #333;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            margin-left: 10px;
        }

        .latency {
            background: #2196f3;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            margin-left: 10px;
        }

        .result-item {
            margin: 10px 0;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
        }

        .result-passed {
            color: #4caf50;
            font-weight: bold;
        }

        .result-failed {
            color: #f44336;
            font-weight: bold;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }

        .stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: #f5f5f5;
            padding: 10px 15px;
            border-radius: 5px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MQTT Message Filtering Dashboard</h1>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connexion en cours...</span>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalMessages">0</div>
                    <div class="stat-label">Messages</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalDecisions">0</div>
                    <div class="stat-label">Décisions</div>
                </div>
            </div>
        </div>

        <div class="grid">
            <!-- Raw Messages -->
            <div class="card">
                <div class="card-header">📨 Messages Bruts (msg.raw)</div>
                <div id="rawMessages" class="empty-state">En attente de messages...</div>
            </div>

            <!-- Partial Scores -->
            <div class="card">
                <div class="card-header">🔍 Scores Partiels</div>
                <div id="partialScores" class="empty-state">En attente de résultats...</div>
            </div>

            <!-- Final Score -->
            <div class="card">
                <div class="card-header">📊 Score Final</div>
                <div id="finalScores" class="empty-state">En attente de scores...</div>
            </div>

            <!-- Decisions -->
            <div class="card full-width">
                <div class="card-header">⚖️ Décisions Finales (msg.decision)</div>
                <div id="decisions" class="empty-state">En attente de décisions...</div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let messageCount = 0;
        let decisionCount = 0;
        const maxItems = 10; // Keep only last 10 items

        // Connection status
        socket.on('connect', () => {
            document.getElementById('statusText').textContent = 'Connecté ✓';
            document.getElementById('statusDot').style.background = '#4caf50';
        });

        socket.on('disconnect', () => {
            document.getElementById('statusText').textContent = 'Déconnecté ✗';
            document.getElementById('statusDot').style.background = '#f44336';
        });

        socket.on('status', (data) => {
            console.log('Status:', data);
        });

        // Raw messages
        socket.on('raw_message', (data) => {
            messageCount++;
            document.getElementById('totalMessages').textContent = messageCount;
            
            const container = document.getElementById('rawMessages');
            if (container.classList.contains('empty-state')) {
                container.classList.remove('empty-state');
                container.innerHTML = '';
            }

            const item = createRawMessageItem(data);
            container.insertBefore(item, container.firstChild);
            
            // Keep only last maxItems
            while (container.children.length > maxItems) {
                container.removeChild(container.lastChild);
            }
        });

        // Keyword result
        socket.on('keyword_result', (data) => {
            updatePartialScore('keyword', data);
        });

        // URL result
        socket.on('url_result', (data) => {
            updatePartialScore('url', data);
        });

        // Format result
        socket.on('format_result', (data) => {
            updatePartialScore('format', data);
        });

        // Final score
        socket.on('score_message', (data) => {
            const container = document.getElementById('finalScores');
            if (container.classList.contains('empty-state')) {
                container.classList.remove('empty-state');
                container.innerHTML = '';
            }

            const item = createScoreItem(data);
            container.insertBefore(item, container.firstChild);
            
            while (container.children.length > maxItems) {
                container.removeChild(container.lastChild);
            }
        });

        // Decision
        socket.on('decision_message', (data) => {
            decisionCount++;
            document.getElementById('totalDecisions').textContent = decisionCount;
            
            const container = document.getElementById('decisions');
            if (container.classList.contains('empty-state')) {
                container.classList.remove('empty-state');
                container.innerHTML = '';
            }

            const item = createDecisionItem(data);
            container.insertBefore(item, container.firstChild);
            
            while (container.children.length > maxItems) {
                container.removeChild(container.lastChild);
            }
        });

        function createRawMessageItem(data) {
            const div = document.createElement('div');
            div.className = 'message-item';
            div.innerHTML = `
                <div class="message-id">ID: ${data.messageId}</div>
                <div class="message-content">${escapeHtml(data.content)}</div>
                <div class="timestamp">${formatTimestamp(data.timestamp)}</div>
            `;
            return div;
        }

        function updatePartialScore(type, data) {
            const container = document.getElementById('partialScores');
            if (container.classList.contains('empty-state')) {
                container.classList.remove('empty-state');
                container.innerHTML = '';
            }

            // Find existing item or create new
            let item = document.getElementById(`score-${data.messageId}-${type}`);
            if (!item) {
                item = document.createElement('div');
                item.className = 'message-item';
                item.id = `score-${data.messageId}-${type}`;
                container.insertBefore(item, container.firstChild);
            }

            const score = data.score || 0;
            const scoreClass = score < 0.3 ? 'score-low' : score < 0.7 ? 'score-medium' : 'score-high';
            
            item.innerHTML = `
                <div class="message-id">${type.toUpperCase()}: ${data.messageId}</div>
                <div class="result-item">
                    <span class="${data.passed ? 'result-passed' : 'result-failed'}">
                        ${data.passed ? '✓ PASS' : '✗ FAIL'}
                    </span>
                    <span class="score-badge ${scoreClass}">Score: ${score.toFixed(2)}</span>
                </div>
            `;

            while (container.children.length > maxItems * 3) {
                container.removeChild(container.lastChild);
            }
        }

        function createScoreItem(data) {
            const div = document.createElement('div');
            div.className = 'message-item';
            const score = data.score || 0;
            const scoreClass = score < 0.3 ? 'score-low' : score < 0.7 ? 'score-medium' : 'score-high';
            
            div.innerHTML = `
                <div class="message-id">ID: ${data.messageId}</div>
                <div>
                    <span class="score-badge ${scoreClass}">Score: ${score.toFixed(2)}</span>
                    ${data.degraded ? '<span class="degraded">DÉGRADÉ</span>' : ''}
                </div>
            `;
            return div;
        }

        function createDecisionItem(data) {
            const div = document.createElement('div');
            div.className = 'message-item';
            
            const decisionClass = `decision-${data.decision}`;
            const latency = data.latency ? `${data.latency.toFixed(0)}ms` : 'N/A';
            
            let partialScores = '';
            if (data.keyword || data.url || data.format) {
                partialScores = '<div style="margin-top: 10px;"><strong>Scores partiels:</strong><br>';
                if (data.keyword) {
                    partialScores += `Keyword: ${(data.keyword.score || 0).toFixed(2)} `;
                }
                if (data.url) {
                    partialScores += `URL: ${(data.url.score || 0).toFixed(2)} `;
                }
                if (data.format) {
                    partialScores += `Format: ${(data.format.score || 0).toFixed(2)}`;
                }
                partialScores += '</div>';
            }
            
            div.innerHTML = `
                <div class="message-id">ID: ${data.messageId}</div>
                <div class="message-content">${escapeHtml(data.raw?.content || 'N/A')}</div>
                <div>
                    <span class="decision-badge ${decisionClass}">${data.decision}</span>
                    <span class="score-badge ${getScoreClass(data.score)}">Score: ${(data.score || 0).toFixed(2)}</span>
                    ${data.degraded ? '<span class="degraded">DÉGRADÉ</span>' : ''}
                    <span class="latency">Latence: ${latency}</span>
                </div>
                ${partialScores}
                <div class="timestamp">${formatTimestamp(data.timestamp)}</div>
            `;
            return div;
        }

        function getScoreClass(score) {
            if (score < 0.3) return 'score-low';
            if (score < 0.7) return 'score-medium';
            return 'score-high';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) return 'N/A';
            try {
                const date = new Date(timestamp);
                return date.toLocaleTimeString('fr-FR');
            } catch {
                return timestamp;
            }
        }
    </script>
</body>
</html>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keyword-filter
  namespace: mqtt-filtering
  labels:
    app: keyword-filter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keyword-filter
  template:
    metadata:
      labels:
        app: keyword-filter
    spec:
      containers:
      - name: keyword-filter
        image: docker-keyword-filter:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: BROKER_HOST
          value: "mosquitto"
        - name: BROKER_PORT
          value: "1883"
        - name: INPUT_TOPIC
          valueFrom:
            configMapKeyRef:
              name: topics-config
              key: RAW_TOPIC
        - name: OUTPUT_TOPIC
          valueFrom:
            configMapKeyRef:
              name: topics-config
              key: KEYWORD_RESULT_TOPIC
        - name: KEYWORD_BLACKLIST
          valueFrom:
            configMapKeyRef:
              name: keyword-blacklist
              key: KEYWORD_BLACKLIST
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "python -c 'import paho.mqtt.client as mqtt; c = mqtt.Client(); c.connect(\"mosquitto\", 1883, 1); c.disconnect()'"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep python"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5


apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-dashboard
  namespace: mqtt-filtering
  labels:
    app: ui-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-dashboard
  template:
    metadata:
      labels:
        app: ui-dashboard
    spec:
      containers:
      - name: ui-dashboard
        image: docker-ui-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: BROKER_HOST
          value: "mosquitto"
        - name: BROKER_PORT
          value: "1883"
        - name: TOPIC_RAW
          valueFrom:
            configMapKeyRef:
              name: topics-config
              key: RAW_TOPIC
        - name: TOPIC_KEYWORD_RESULT
          valueFrom:
            configMapKeyRef:
              name: topics-config
              key: KEYWORD_RESULT_TOPIC
        - name: TOPIC_URL_RESULT
          valueFrom:
            configMapKeyRef:
              name: topics-config
              key: URL_RESULT_TOPIC
        - name: TOPIC_FORMAT_RESULT
          valueFrom:
            configMapKeyRef:
              name: topics-config
              key: FORMAT_RESULT_TOPIC
        - name: TOPIC_SCORE
          valueFrom:
            configMapKeyRef:
              name: topics-config
              key: SCORE_TOPIC
        - name: TOPIC_DECISION
          valueFrom:
            configMapKeyRef:
              name: topics-config
              key: DECISION_TOPIC
        - name: PORT
          value: "5000"
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ui-dashboard
  namespace: mqtt-filtering
  labels:
    app: ui-dashboard
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http
    nodePort: 30080
  selector:
    app: ui-dashboard


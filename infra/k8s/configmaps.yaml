apiVersion: v1
kind: ConfigMap
metadata:
  name: topics-config
  namespace: mqtt-filtering
data:
  RAW_TOPIC: "msg.raw"
  KEYWORD_RESULT_TOPIC: "msg.keyword.result"
  URL_RESULT_TOPIC: "msg.url.result"
  FORMAT_RESULT_TOPIC: "msg.format.result"
  SCORE_TOPIC: "msg.score"
  DECISION_TOPIC: "msg.decision"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keyword-blacklist
  namespace: mqtt-filtering
data:
  KEYWORD_BLACKLIST: "URGENT,WIN,CLICK,OFFER"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: suspicious-domains
  namespace: mqtt-filtering
data:
  SUSPICIOUS_DOMAINS: "suspicious-site.com,spam-domain.net"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: router-thresholds
  namespace: mqtt-filtering
data:
  THRESHOLD_A: "0.3"
  THRESHOLD_B: "0.7"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: format-rules
  namespace: mqtt-filtering
data:
  MAX_LENGTH: "200"
  FORBIDDEN_CHARS: "|,<,>"
  MAX_SYMBOL_RATIO: "0.3"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aggregator-config
  namespace: mqtt-filtering
data:
  JOIN_TIMEOUT_SECONDS: "3"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: generator-config
  namespace: mqtt-filtering
data:
  INTERVAL_SECONDS: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: broker-config
  namespace: mqtt-filtering
data:
  BROKER_PORT: "1883"
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    
    persistence true
    persistence_location /mosquitto/data/
    
    log_dest file /mosquitto/log/mosquitto.log
    log_type all

